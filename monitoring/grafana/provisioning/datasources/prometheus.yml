apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid so the provisioned dashboard and alert rule can reference this
    # datasource deterministically on any machine.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Match the Prometheus scrape_interval so $__rate_interval resolves sensibly.
      timeInterval: 5s
