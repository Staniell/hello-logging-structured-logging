apiVersion: 1

groups:
  - orgId: 1
    name: hellologging
    folder: HelloLogging
    interval: 10s
    rules:
      - uid: hellologging-high-5xx
        title: High 5xx error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rate(http_requests_received_total{code=~"5.."}[1m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
        # Before the first error the 5xx series does not exist, so the query returns
        # an empty set — treat that as Normal instead of NoData.
        noDataState: OK
        execErrState: Error
        # Fire on the first breached evaluation — demo speed over alert hygiene.
        for: 0s
        annotations:
          summary: 5xx rate is above 0.05 req/s over the last minute on the HelloLogging API.
        labels:
          severity: demo
