name: hellologging

services:
  api:
    build:
      context: .
      dockerfile: HelloLogging/Dockerfile
    image: hellologging-api:local
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Db: "Host=db;Port=5432;Database=hellologging;Username=hellologging;Password=hellologging-local"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hellologging
      POSTGRES_PASSWORD: hellologging-local
      POSTGRES_DB: hellologging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellologging -d hellologging"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.13.0
    ports:
      - "9090:9090"
    volumes:
      # Config is bind-mounted (read-only); metric history lives in a named volume
      # because databases on NTFS bind mounts are unreliable under Docker Desktop.
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:13.0.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana-local
    volumes:
      # Everything is provisioned as code: datasource, dashboard, and alert rule.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
